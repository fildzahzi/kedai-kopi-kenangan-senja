<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/51ecf143e2.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/x-icon" href="../img/coffee.ico">
  <link rel="stylesheet" href="../booking/booking.css">
  <title>Booking Tempat</title>
</head>

<body>

  <!-- Navbar Start -->
  <nav class="navbar">
    <a href="#" class="navbar-logo">booking<span>tempat</span>.</a>

    <div class="navbar-nav">
      <ul>
        <li><a href="../home/index.html">Kembali ke Beranda</a></li>
        <li><a href="../pesan/cobakeranjang.html" id="navpesansekarang">Buat Pesanan</a></li>
        <li><a href="../booking/booking.html">Booking Tempat</a></li>
      </ul>
    </div>
  </nav>

  <div class="element">
    <h3>Formulir<span> Booking</span></h3>
    <form>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Nama</label>
        <input type="text" class="form-control" id="nama" aria-describedby="emailHelp" placeholder="Masukkan Nama">
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Nomor WA</label>
        <input type="number" class="form-control" id="nomor" placeholder="Masukkan Nomor WA">
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Hari & Tanggal</label>
        <input type="text" class="form-control" id="tanggal" placeholder="contoh : Senin, 9 Feb 2023">
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Jam Kedatangan</label>
        <input type="text" class="form-control" id="waktu" placeholder="contoh : jam 4 sore">
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Jumlah Tamu</label>
        <input type="text" class="form-control" id="tamu" placeholder="contoh : 5 orang">
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Pilih Lokasi</label>
        <div class="pilih">
          <select id="myDropdown" class="lokasi">
            <option value="Rooftop">Rooftop</option>
            <option value="Indoor">Indoor</option>
            <option value="Outdoor">Outdoor</option>
          </select>
        </div>
      </div>

      <label for="exampleInputPassword1" class="form-label">Catatan</label>
      <div class="input-group">
        <textarea class="form-control" id="text" aria-label="With textarea"
          placeholder="tambah catatan lain bila ada"></textarea>
      </div>

      <p>Pastikan Anda telah Mengisi dengan Benar</p>

      <button type="submit" class="btn btn-primary" id="pesan" onclick="simpanbookingan()">Pesan</button>
    </form>
  </div>


  <!-- Footer Start -->
  <footer>
    <div class="socials">
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
    </div>

    <div class="links">
      <a href="#home">Home</a>
      <a href="#about">Tentang Kami</a>
      <a href="#menu">Menu</a>
      <a href="#contact">Kontak</a>
    </div>

    <div class="credit">
      <p>Created by <a href="https://www.instagram.com/fildzahzi_/">fildzahzi_</a> | &copy; 2023.</p>
    </div>
  </footer>
  <!-- Footer End -->
  <script src="../booking/booking.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
    crossorigin="anonymous"></script>
</body>

</html>
